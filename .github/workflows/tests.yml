name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The tests cover pure logic only, so the Playwright package
      # is installed but no browser is downloaded.
      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Check every script compiles
        run: python -m py_compile monitor/*.py tools/*.py

      - name: Run tests
        run: pytest -q
